name: flodo
description: "Flodo — Task Management App (Flodo AI Assessment, Track A)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.4.3

  # Navigation
  go_router: ^13.2.0

  # Local storage (drafts)
  shared_preferences: ^2.2.3

  # Env config
  flutter_dotenv: ^5.1.0

  # Date formatting
  intl: ^0.19.0
  flutter_animate: ^4.5.2
  lucide_icons: ^0.257.0
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - .env
