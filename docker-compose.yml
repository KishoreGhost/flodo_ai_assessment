version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flodo_backend
    ports:
      - "8000:8000"
    volumes:
      # Mount a local data directory to persist the SQLite database
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/flodo.db
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flodo_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
